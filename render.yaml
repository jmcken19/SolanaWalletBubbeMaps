services:
  - type: web
    name: solana-tracker   # keep: renaming makes Render create a new service + URL
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: python server.py
    healthCheckPath: /healthz
    envVars:
      - key: HELIUS_API_KEY
        sync: false
      - key: JUPITER_API_KEY   # optional, free at portal.jup.ag
        sync: false
      - key: DATABASE_URL      # only for the Postgres CLI (main.py / runner.py)
        sync: false
