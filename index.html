<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Solana Wallet Bubble Map</title>
  <meta name="theme-color" content="#07070A">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <style>
    /* Colours and type from the salary repo's theme (web/styles.css). Layout is this app's own. */
    :root {
      --bg: #07070A; --bg-2: #0C0C10; --surface: #111116; --surface-2: #17171D;
      --ink: #EDEAE3; --ink-2: #A9A7B0; --ink-3: #8E8C96;
      --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14); --line-3: rgba(255,255,255,.28);
      --spectrum: linear-gradient(90deg, #FF4F7B, #FF8A3D, #F4E2B8, #5BB6FF);
      --signal: #FF8A3D; --err: #FF9A85;
      --display: "Archivo", "Helvetica Neue", Helvetica, sans-serif;
      --sans: "IBM Plex Sans", "Helvetica Neue", Helvetica, sans-serif;
      --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
      --radius: 2px;
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    html, body {
      width: 100%; min-height: 100%;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-top: 80px;
      padding-bottom: 200px;
      padding-left: 16px;
      padding-right: 16px;
    }

    ::selection { background: var(--ink); color: var(--bg); }
    :focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }

    /* Section labels: mono, tracked, with the thin spectrum rule */
    #card-label, #bubble-label, #heatmap-label {
      position: relative;
      display: inline-block;
      font: 500 12px/1.4 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      padding-bottom: 10px;
    }
    #card-label::after, #bubble-label::after, #heatmap-label::after {
      content: ""; position: absolute; left: 0; bottom: 0; width: 40px; height: 2px; background: var(--spectrum);
    }

    #card {
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 28px 32px 32px;
      width: min(760px, 100%);
      flex-shrink: 0;
    }

    #card-label { margin-bottom: 18px; }

    #wallet {
      display: block;
      width: 100%;
      font-family: var(--mono);
      font-size: 14px;
      color: var(--ink-3);
      background: transparent;
      border: none;
      border-bottom: 1px solid var(--line-2);
      padding: 4px 0 8px;
      outline: none;
      letter-spacing: 0.01em;
      transition: border-color 0.15s, color 0.15s;
    }

    #wallet.active {
      color: var(--ink);
      border-bottom-color: var(--ink-2);
    }
    #wallet[aria-invalid=true] { border-bottom-color: var(--err); }

    #wallet-err { color: var(--err); font-size: 14px; min-height: 1.4em; margin-top: 8px; }

    #enter {
      display: block;
      width: 100%;
      margin-top: 12px;
      min-height: 44px;
      background: var(--ink);
      color: var(--bg);
      border: none;
      border-radius: var(--radius);
      font: 600 15px/1 var(--sans);
      cursor: pointer;
      transition: background 0.15s;
    }

    #enter:hover  { background: #fff; }
    #enter:disabled { opacity: .55; cursor: progress; }

    /* ── Popular wallets ────────────────────────────────────────────────────── */
    #popular { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--line); }
    #popular-label { display: block; font: 500 12px/1.4 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink-3); margin-bottom: 12px; }
    #popular-list { display: flex; flex-wrap: wrap; gap: 8px; }
    .pick {
      display: inline-flex; align-items: baseline; gap: 8px; min-height: 40px; padding: 8px 12px;
      background: transparent; color: var(--ink); border: 1px solid var(--line-2); border-radius: var(--radius);
      font: 500 14px var(--sans); cursor: pointer; transition: border-color .15s, background .15s;
    }
    .pick:hover { border-color: var(--ink-2); background: var(--surface-2); }
    .pick small { font: 400 12px var(--mono); color: var(--ink-3); }
    #popular-note { margin-top: 10px; font-size: 12px; color: var(--ink-3); }
    #popular-note a { color: var(--ink-2); }

    /* ── Side-by-side panel row ─────────────────────────────────────────────── */
    #panels {
      display: flex;
      gap: 16px;
      width: min(1200px, 100%);
      margin-top: 16px;
      align-items: stretch;
    }

    @media (max-width: 768px) {
      html, body { padding-top: 32px; }
      #panels { flex-direction: column; }
      #bubble-canvas { height: 360px; }
    }

    /* ── Bubble map ─────────────────────────────────────────────────────────── */
    #bubble-wrap {
      flex: 1;
      min-width: 0;
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: var(--radius);
    }

    #bubble-label { margin: 18px 24px 0; }
    #bubble-wallet {
      display: block;
      font: 400 12px var(--mono);
      letter-spacing: 0.04em;
      color: var(--ink-3);
      padding: 6px 24px 0;
    }

    #bubble-placeholder {
      padding: 20px 24px;
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-3);
    }
    #bubble-placeholder.error { color: var(--err); }

    #bubble-canvas {
      display: none;
      width: 100%;
      height: 500px;
      cursor: pointer;
      margin-top: 12px;
    }

    #token-detail {
      display: none;
      border-top: 1px solid var(--line);
      padding: 16px 24px 20px;
    }

    #token-detail-name {
      font: 700 22px/1.2 var(--display);
      font-stretch: 75%;
      margin-bottom: 10px;
      color: var(--ink);
      overflow-wrap: anywhere;
    }
    .badge {
      font: 500 11px var(--mono); color: var(--ink-3); text-transform: uppercase;
      letter-spacing: 0.1em; margin-left: 8px; vertical-align: 3px;
    }
    .badge.priced { color: var(--signal); }

    .detail-grid {
      display: grid;
      grid-template-columns: max-content 1fr;
      gap: 6px 20px;
      font-family: var(--mono);
      font-size: 13px;
    }

    .detail-grid .label { color: var(--ink-3); }
    .detail-grid .value { color: var(--ink); overflow-wrap: anywhere; }
    .detail-grid .desc { grid-column: 1 / -1; font-family: var(--sans); font-size: 14px; color: var(--ink-2); padding-bottom: 8px; line-height: 1.7; }
    .detail-grid .rule { grid-column: 1 / -1; border-top: 1px solid var(--line); margin-bottom: 4px; }

    .copy-btn {
      margin-top: 8px; background: transparent; color: var(--ink); border: 1px solid var(--line-3);
      border-radius: var(--radius); font: 600 13px var(--sans); padding: 6px 14px; cursor: pointer;
      transition: border-color .15s;
    }
    .copy-btn:hover { border-color: var(--ink); }

    /* ── Summary bar ────────────────────────────────────────────────────────── */
    #summary-bar {
      width: min(1200px, 100%);
      margin-top: 16px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: var(--radius);
      grid-template-columns: repeat(3, 1fr);
      display: none;
    }
    #summary-bar.visible { display: grid; }

    .stat-cell {
      padding: 28px 28px;
      border-right: 1px solid var(--line);
    }
    .stat-cell:last-child { border-right: none; }

    .stat-label {
      display: block;
      font: 500 12px/1.4 var(--mono);
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--ink-3);
      margin-bottom: 10px;
    }

    .stat-value {
      display: block;
      font: 700 34px/1.1 var(--display);
      font-stretch: 75%;
      font-variant-numeric: tabular-nums;
      color: var(--ink);
    }

    .stat-sub {
      display: block;
      font-size: 13px;
      color: var(--ink-3);
      margin-top: 6px;
    }

    @media (max-width: 768px) {
      #summary-bar { grid-template-columns: 1fr; }
      .stat-cell { border-right: none; border-bottom: 1px solid var(--line); }
      .stat-cell:last-child { border-bottom: none; }
    }

    /* ── Heatmap ─────────────────────────────────────────────────────────── */
    #heatmap-wrap {
      width: min(1200px, 100%);
      margin-top: 16px;
      border: 1px solid var(--line-2);
      background: var(--surface);
      border-radius: var(--radius);
      padding: 18px 24px 24px;
      display: none;
    }
    #heatmap-wrap.visible { display: block; }

    #heatmap-label { margin-bottom: 14px; }

    #heatmap-placeholder {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--ink-3);
    }

    #heatmap-chart { display: none; overflow-x: auto; }

    .heatmap-inner { display: inline-block; }

    .heatmap-month-row {
      position: relative;
      height: 16px;
      margin-bottom: 4px;
    }

    .heatmap-month {
      position: absolute;
      font: 500 10px var(--mono);
      letter-spacing: 0.10em;
      color: var(--ink-3);
      text-transform: uppercase;
      white-space: nowrap;
    }

    .heatmap-grid {
      display: flex;
      gap: 3px;
    }

    .heatmap-col {
      display: flex;
      flex-direction: column;
      gap: 3px;
    }

    .heatmap-cell {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    .heatmap-legend {
      display: flex;
      align-items: center;
      gap: 6px;
      margin-top: 10px;
      font: 500 10px var(--mono);
      color: var(--ink-3);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    .legend-cell {
      width: 13px;
      height: 13px;
      border-radius: 2px;
      flex-shrink: 0;
    }

    #heatmap-tooltip {
      position: fixed;
      display: none;
      background: var(--ink);
      color: var(--bg);
      font-family: var(--mono);
      font-size: 12px;
      padding: 5px 12px;
      border-radius: var(--radius);
      pointer-events: none;
      z-index: 1000;
      white-space: nowrap;
    }
  </style>
</head>
<body>

  <div id="card">
    <span id="card-label">Wallet Address</span>
    <input
      id="wallet"
      type="text"
      value="FuUKYBncpU3BSJ43hgKigKhzYrigWUEja3n69gzNTxeP"
      spellcheck="false"
      autocomplete="off"
      aria-label="Wallet address"
      aria-describedby="wallet-err"
    >
    <p id="wallet-err" role="alert"></p>
    <button id="enter">Enter</button>
    <div id="popular">
      <span id="popular-label">Popular wallets</span>
      <div id="popular-list"></div>
      <p id="popular-note">Labels from the <a href="https://orbmarkets.io" target="_blank" rel="noopener">Orb</a> explorer (Helius).</p>
    </div>
  </div>

  <div id="summary-bar">
    <div class="stat-cell">
      <span class="stat-label">Total Value</span>
      <span class="stat-value" id="stat-total-value">—</span>
      <span class="stat-sub" id="stat-total-value-sub">—</span>
    </div>
    <div class="stat-cell">
      <span class="stat-label">SOL Balance</span>
      <span class="stat-value" id="stat-sol-balance">—</span>
      <span class="stat-sub" id="stat-sol-balance-sub">—</span>
    </div>
    <div class="stat-cell">
      <span class="stat-label">Token Balance</span>
      <span class="stat-value" id="stat-token-balance">—</span>
      <span class="stat-sub" id="stat-token-balance-sub">—</span>
    </div>
  </div>

  <div id="panels">
    <div id="bubble-wrap">
      <span id="bubble-label">Bubble Map</span>
      <span id="bubble-wallet"></span>
      <div id="bubble-placeholder">Waiting for input...</div>
      <canvas id="bubble-canvas"></canvas>
      <div id="token-detail">
        <div id="token-detail-name"></div>
        <div class="detail-grid" id="token-detail-grid"></div>
      </div>
    </div>
  </div>


  <div id="heatmap-wrap">
    <span id="heatmap-label">Trading Activity</span>
    <div id="heatmap-placeholder">Run analysis to see activity</div>
    <div id="heatmap-chart"></div>
  </div>
  <div id="heatmap-tooltip"></div>

  <script>
    const DEFAULT    = 'FuUKYBncpU3BSJ43hgKigKhzYrigWUEja3n69gzNTxeP';
    const ADDRESS_RE = /^[1-9A-HJ-NP-Za-km-z]{32,44}$/;
    const SOL_MINT   = 'So11111111111111111111111111111111111111112';
    const STABLECOINS = new Set(['USDC', 'USDT', 'USDH']);
    const input    = document.getElementById('wallet');
    const enterBtn = document.getElementById('enter');
    const errEl    = document.getElementById('wallet-err');

    // Token names and symbols come from on-chain metadata, which anyone can set.
    // Everything from the chain goes through esc() before it touches innerHTML.
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

    // ── Input behaviour ──────────────────────────────────────────────────────
    input.addEventListener('focus', () => {
      if (input.value === DEFAULT) input.select();
    });

    input.addEventListener('input', () => {
      input.classList.toggle('active', input.value !== DEFAULT && input.value !== '');
      showErr('');
    });

    input.addEventListener('blur', () => {
      if (input.value.trim() === '') {
        input.value = DEFAULT;
        input.classList.remove('active');
      }
    });

    input.addEventListener('keydown', e => {
      if (e.key === 'Enter') run();
    });

    enterBtn.addEventListener('click', run);

    // ── Popular wallets ──────────────────────────────────────────────────────
    // Only wallets with a public label; each source is linked from the button's title.
    const POPULAR = [
      { name: 'Binance Cold Wallet',   address: 'H8BgJgae6qhMtf7BM2JtddywSQt11WdxHHxkGLNX5hss' },
      { name: 'Binance Cold Wallet 3', address: 'G9RCBaYb8aBRxoe8QBC2ucGrVqjuZFysRhY8d56cnNT1' },
      { name: 'Coinbase Hot Wallet 3', address: 'FpwQQhQQoEaVu3WU2qZMfF1hx48YyfwsLoRgXG83E99Q' },
      { name: 'Coinbase Hot Wallet 8', address: '4NyK1AdJBNbgaJ9EsKz3J4rfeHsuYdjkTPg3JaNdLeFw' },
    ];
    const popularList = document.getElementById('popular-list');
    POPULAR.forEach(w => {
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'pick';
      b.title = `${w.address} (label: orbmarkets.io/address/${w.address})`;
      b.innerHTML = `${esc(w.name)} <small>${esc(w.address.slice(0, 4) + '…' + w.address.slice(-4))}</small>`;
      b.addEventListener('click', () => {
        input.value = w.address;
        input.classList.add('active');
        run();
      });
      popularList.appendChild(b);
    });

    function showErr(msg) {
      errEl.textContent = msg;
      input.setAttribute('aria-invalid', msg ? 'true' : 'false');
    }

    // ── Lookup ───────────────────────────────────────────────────────────────
    let inflight = null;

    async function run() {
      const addr = input.value.trim();
      if (!ADDRESS_RE.test(addr)) {
        showErr("That doesn't look like a Solana wallet address. Paste the full address (32 to 44 characters).");
        return;
      }
      showErr('');
      if (inflight) inflight.abort();
      inflight = new AbortController();

      enterBtn.disabled    = true;
      enterBtn.textContent = 'Running...';

      resetView(addr);

      try {
        const r = await fetch(`/api/wallet?address=${encodeURIComponent(addr)}`, { signal: inflight.signal });
        const data = await r.json().catch(() => ({ error: "The server sent a reply we couldn't read. Try again." }));
        if (!r.ok || data.error) throw new Error(data.error || 'Something went wrong. Try again.');
        showHoldings(addr, data.holdings || []);
        showHeatmap(data.activity);
      } catch (e) {
        if (e.name === 'AbortError') return;
        const msg = e.message === 'Failed to fetch' ? "Couldn't reach the server. Check your connection and try again." : e.message;
        const ph = document.getElementById('bubble-placeholder');
        ph.textContent = msg;
        ph.classList.add('error');
        document.getElementById('bubble-wallet').textContent = shortAddr(addr);
        document.getElementById('heatmap-wrap').classList.remove('visible');
      } finally {
        enterBtn.disabled    = false;
        enterBtn.textContent = 'Enter';
      }
    }

    const shortAddr = a => a ? a.slice(0, 4) + '…' + a.slice(-4) : '';

    function resetView(addr) {
      document.getElementById('summary-bar').classList.remove('visible');

      const hw = document.getElementById('heatmap-wrap');
      hw.classList.add('visible');
      document.getElementById('heatmap-chart').style.display = 'none';
      const hp = document.getElementById('heatmap-placeholder');
      hp.style.display = 'block';
      hp.textContent = 'Loading activity…';

      disposeBubbles();
      const canvas = document.getElementById('bubble-canvas');
      const placeholder = document.getElementById('bubble-placeholder');
      canvas.style.display      = 'none';
      placeholder.style.display = 'block';
      placeholder.classList.remove('error');
      placeholder.textContent   = 'Loading holdings…';
      document.getElementById('bubble-wallet').textContent = `Loading ${shortAddr(addr)}…`;
      document.getElementById('token-detail').style.display = 'none';
    }

    function showHoldings(addr, holdings) {
      document.getElementById('bubble-wallet').textContent = shortAddr(addr);
      if (!holdings.length) {
        document.getElementById('bubble-placeholder').textContent = 'No holdings found.';
        return;
      }
      renderBubbles(holdings);

      const sol        = holdings.find(h => h.mint === SOL_MINT);
      const tokens     = holdings.filter(h => h.mint !== SOL_MINT);
      const totalValue = holdings.reduce((s, h) => s + (h.usd_value || 0), 0);
      const tokenValue = tokens.reduce((s, h) => s + (h.usd_value || 0), 0);

      // ── Total value ───────────────────────────────────────────────
      const pricedCount = holdings.filter(h => h.usd_value != null).length;
      document.getElementById('stat-total-value').textContent = `$${fmtAmt(totalValue)}`;
      document.getElementById('stat-total-value-sub').textContent =
        `${holdings.length} token${holdings.length !== 1 ? 's' : ''} · ${pricedCount} with known price`;

      // ── SOL balance ───────────────────────────────────────────────
      if (sol && sol.usd_value != null) {
        document.getElementById('stat-sol-balance').textContent = `$${fmtAmt(sol.usd_value)}`;
        document.getElementById('stat-sol-balance-sub').textContent = `${fmtAmt(sol.amount)} SOL`;
      } else {
        document.getElementById('stat-sol-balance').textContent = sol ? `${fmtAmt(sol.amount)} SOL` : '$0.00';
        document.getElementById('stat-sol-balance-sub').textContent = sol ? 'price unavailable' : '0 SOL held';
      }

      // ── Token balance ─────────────────────────────────────────────
      document.getElementById('stat-token-balance').textContent = `$${fmtAmt(tokenValue)}`;
      document.getElementById('stat-token-balance-sub').textContent =
        `across ${tokens.length} token${tokens.length !== 1 ? 's' : ''}`;

      document.getElementById('summary-bar').classList.add('visible');
    }

    // ── Bubble chart ─────────────────────────────────────────────────────────
    let bubble = null;   // { renderer, alive, ac, ro }

    function disposeBubbles() {
      if (!bubble) return;
      bubble.alive = false;
      bubble.ac.abort();       // removes the click listener
      bubble.ro.disconnect();  // removes the resize watcher
      bubble.renderer.dispose();
      bubble = null;
    }

    function renderBubbles(tokens) {
      const placeholder = document.getElementById('bubble-placeholder');
      const canvas      = document.getElementById('bubble-canvas');
      const wrap        = document.getElementById('bubble-wrap');

      disposeBubbles();
      if (!window.THREE) { placeholder.textContent = "The 3D map couldn't load."; return; }

      placeholder.style.display = 'none';
      canvas.style.display      = 'block';

      const scene    = new THREE.Scene();
      scene.background = new THREE.Color(0x111116);

      const camera   = new THREE.PerspectiveCamera(60, 1, 0.1, 500);

      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

      scene.add(new THREE.AmbientLight(0xffffff, 0.55));
      const dir = new THREE.DirectionalLight(0xffffff, 0.8);
      dir.position.set(5, 10, 5);
      scene.add(dir);

      const controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping  = true;
      controls.dampingFactor  = 0.05;
      controls.autoRotate     = !matchMedia('(prefers-reduced-motion: reduce)').matches;
      controls.autoRotateSpeed = 0.6;

      const minSize  = 0.3;
      const maxSize  = 2.0;
      // Log scale so small holdings stay visible when one token dominates
      const logVal    = v => v > 0 ? Math.log10(v + 1) : 0;
      const knownVals = tokens.filter(t => t.usd_value != null).map(t => t.usd_value);
      const maxLog = logVal((knownVals.length ? Math.max(...knownVals) : 1) || 1) || 1;

      // Ring radius large enough that adjacent bubbles never touch
      const gap  = 0.5;
      const ring = tokens.length > 1
        ? Math.max(10, (maxSize + gap) / Math.sin(Math.PI / tokens.length))
        : 10;


      const clickableMeshes = [];
      const meshTokenMap    = new Map();

      tokens.forEach((token, i) => {
        const angle   = (i / tokens.length) * Math.PI * 2;
        const priced  = token.usd_value != null;
        const size    = priced ? minSize + (logVal(token.usd_value) / maxLog) * (maxSize - minSize) : minSize;

        // Fill sphere — grey for priced tokens, warm tint for unpriced ones
        const geo  = new THREE.SphereGeometry(size, 32, 32);
        const mat  = new THREE.MeshStandardMaterial({
          color:     priced ? 0x3A3A44 : 0x3A2A20,
          roughness: priced ? 0.6 : 0.8,
          metalness: 0,
        });
        const mesh = new THREE.Mesh(geo, mat);
        mesh.position.set(Math.cos(angle) * ring, 0, Math.sin(angle) * ring);
        scene.add(mesh);
        clickableMeshes.push(mesh);
        meshTokenMap.set(mesh.uuid, token);

        // Wireframe overlay — more visible for unpriced tokens
        const wfMat  = new THREE.MeshBasicMaterial({
          color:       priced ? 0xEDEAE3 : 0xFF8A3D,
          wireframe:   true,
          transparent: true,
          opacity:     priced ? 0.12 : 0.3,
        });
        const wfMesh = new THREE.Mesh(new THREE.SphereGeometry(size * 1.002, 16, 16), wfMat);
        wfMesh.position.copy(mesh.position);
        scene.add(wfMesh);

        // Label sprite
        const labelSub = priced ? `$${fmtAmt(token.usd_value)}` : `${fmtAmt(token.amount)} tokens`;
        const label = makeLabel(token.symbol, labelSub);
        label.position.set(mesh.position.x, mesh.position.y + size + 0.6, mesh.position.z);
        scene.add(label);
      });

      // Click to drill down
      const ac = new AbortController();
      const raycaster = new THREE.Raycaster();
      canvas.addEventListener('click', e => {
        const rect  = canvas.getBoundingClientRect();
        const mouse = new THREE.Vector2(
          ((e.clientX - rect.left)  / rect.width)  *  2 - 1,
          ((e.clientY - rect.top)   / rect.height) * -2 + 1
        );
        raycaster.setFromCamera(mouse, camera);
        const hits = raycaster.intersectObjects(clickableMeshes);
        if (hits.length > 0) showHoldingDetail(meshTokenMap.get(hits[0].object.uuid));
      }, { signal: ac.signal });

      const resize = () => {
        const W = wrap.clientWidth, H = canvas.clientHeight || 500;
        camera.aspect = W / H;
        camera.updateProjectionMatrix();
        // Pull the camera back on narrow screens so the whole ring stays in frame
        const halfW = Math.atan(Math.tan(THREE.MathUtils.degToRad(camera.fov / 2)) * camera.aspect);
        const dist  = Math.max(ring * 1.9, (ring + maxSize + 1) / Math.tan(halfW));
        camera.position.set(0, 0.18, 1).normalize().multiplyScalar(dist);
        renderer.setSize(W, H, false);
      };
      const ro = new ResizeObserver(resize);
      ro.observe(wrap);
      resize();

      bubble = { renderer, alive: true, ac, ro };
      const me = bubble;
      (function animate() {
        if (!me.alive) return;
        requestAnimationFrame(animate);
        controls.update();
        renderer.render(scene, camera);
      })();
    }

    function fmtAmt(val) {
      const abs  = Math.abs(val);
      const sign = val < 0 ? '-' : '';
      if (abs >= 1e9) return sign + (abs / 1e9).toFixed(2) + 'B';
      if (abs >= 1e6) return sign + (abs / 1e6).toFixed(2) + 'M';
      if (abs >= 1)   return sign + abs.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
      if (abs === 0)  return '0';
      // Small amounts: show enough precision to be non-zero
      return sign + abs.toLocaleString('en-US', { minimumSignificantDigits: 2, maximumSignificantDigits: 4 });
    }

    function copyTokenAddr(btn) {
      const text = btn.getAttribute('data-addr');
      const done = () => {
        btn.textContent = 'Copied!';
        setTimeout(() => { btn.textContent = 'Copy address'; }, 1500);
      };
      navigator.clipboard.writeText(text).then(done).catch(() => {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        done();
      });
    }
    document.getElementById('token-detail-grid').addEventListener('click', e => {
      const b = e.target.closest('.copy-btn');
      if (b) copyTokenAddr(b);
    });

    function makeLabel(name, subtitle) {
      const c   = document.createElement('canvas');
      c.width   = 256;
      c.height  = 80;
      const ctx = c.getContext('2d');

      // Shorten long names for display
      const displayName = name.length > 12 ? name.slice(0, 6) + '…' + name.slice(-4) : name;

      ctx.font      = '600 30px "IBM Plex Sans", sans-serif';
      ctx.fillStyle = '#EDEAE3';
      ctx.textAlign = 'center';
      ctx.fillText(displayName, 128, 34);

      ctx.font      = '500 20px "IBM Plex Mono", monospace';
      ctx.fillStyle = '#8E8C96';
      ctx.fillText(subtitle, 128, 60);

      const tex    = new THREE.CanvasTexture(c);
      const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, transparent: true }));
      sprite.scale.set(3.2, 1, 1);
      return sprite;
    }

    // ── Heatmap (UTC days, matching how the server counts them) ──────────────
    const HEAT_COLORS = ['#17171D', 'rgba(255,138,61,.28)', 'rgba(255,138,61,.5)', 'rgba(255,138,61,.75)', '#FF8A3D'];

    function heatColor(count, max) {
      if (count === 0) return HEAT_COLORS[0];
      const ratio = count / max;
      if (ratio <= 0.25) return HEAT_COLORS[1];
      if (ratio <= 0.50) return HEAT_COLORS[2];
      if (ratio <= 0.75) return HEAT_COLORS[3];
      return HEAT_COLORS[4];
    }

    function showHeatmap(activity) {
      const placeholder = document.getElementById('heatmap-placeholder');
      if (!activity) { placeholder.textContent = "Couldn't load trading activity."; return; }
      if (!activity.count) { placeholder.textContent = 'No transactions found.'; return; }
      renderHeatmap(activity.days || {});
    }

    function renderHeatmap(data) {
      const chart       = document.getElementById('heatmap-chart');
      const placeholder = document.getElementById('heatmap-placeholder');

      // Build 52-week window ending today (UTC)
      const DAY   = 864e5;
      const now   = new Date();
      const today = Date.UTC(now.getUTCFullYear(), now.getUTCMonth(), now.getUTCDate());
      const startSunday = today - (new Date(today).getUTCDay() + 52 * 7) * DAY;

      // Build array of week arrays
      const weeks = [];
      for (let t = startSunday; t <= today; t += 7 * DAY) {
        const week = [];
        for (let d = 0; d < 7 && t + d * DAY <= today; d++) week.push(new Date(t + d * DAY));
        weeks.push(week);
      }

      const maxCount = Math.max(1, ...Object.values(data).map(Number));
      const monthName = d => d.toLocaleString('en-US', { month: 'short', timeZone: 'UTC' });

      const inner = document.createElement('div');
      inner.className = 'heatmap-inner';

      // Month label row
      const monthRow = document.createElement('div');
      monthRow.className = 'heatmap-month-row';
      const CELL_STEP = 16; // 13px cell + 3px gap

      const firstLabel = document.createElement('span');
      firstLabel.className = 'heatmap-month';
      firstLabel.style.left = '0px';
      firstLabel.textContent = monthName(weeks[0][0]);
      monthRow.appendChild(firstLabel);

      let lastLabelX = 0;
      weeks.forEach((week, wi) => {
        if (wi === 0) return;
        const prevMonth = weeks[wi - 1][0].getUTCMonth();
        const curMonth  = week[0].getUTCMonth();
        const x = wi * CELL_STEP;
        if (curMonth !== prevMonth && x - lastLabelX >= 28) {
          const lbl = document.createElement('span');
          lbl.className  = 'heatmap-month';
          lbl.style.left = x + 'px';
          lbl.textContent = monthName(week[0]);
          monthRow.appendChild(lbl);
          lastLabelX = x;
        }
      });
      inner.appendChild(monthRow);

      // Cell grid
      const grid = document.createElement('div');
      grid.className = 'heatmap-grid';

      weeks.forEach(week => {
        const col = document.createElement('div');
        col.className = 'heatmap-col';
        week.forEach(date => {
          const dateStr = date.toISOString().slice(0, 10);
          const count   = data[dateStr] || 0;
          const cell    = document.createElement('div');
          cell.className        = 'heatmap-cell';
          cell.style.background = heatColor(count, maxCount);
          cell.dataset.date     = dateStr;
          cell.dataset.count    = count;
          col.appendChild(cell);
        });
        grid.appendChild(col);
      });
      inner.appendChild(grid);

      // Legend
      const legend = document.createElement('div');
      legend.className = 'heatmap-legend';
      legend.innerHTML = `<span>Less</span>` +
        HEAT_COLORS.map(c => `<div class="legend-cell" style="background:${c}"></div>`).join('') +
        `<span>More</span>`;
      inner.appendChild(legend);

      chart.innerHTML = '';
      chart.appendChild(inner);

      placeholder.style.display = 'none';
      chart.style.display = 'block';
      chart.scrollLeft = chart.scrollWidth;   // newest weeks visible on narrow screens
    }

    // Tooltip listeners are attached once, not on every render.
    (function () {
      const chart   = document.getElementById('heatmap-chart');
      const tooltip = document.getElementById('heatmap-tooltip');
      chart.addEventListener('mouseover', e => {
        const cell = e.target.closest('.heatmap-cell');
        if (!cell) { tooltip.style.display = 'none'; return; }
        const count = parseInt(cell.dataset.count);
        const d     = new Date(cell.dataset.date + 'T12:00:00Z');
        const label = d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric', timeZone: 'UTC' });
        tooltip.textContent = count > 0
          ? `${label} — ${count} trade${count !== 1 ? 's' : ''}`
          : `${label} — No activity`;
        tooltip.style.display = 'block';
      });
      chart.addEventListener('mousemove', e => {
        tooltip.style.left = (e.clientX + 14) + 'px';
        tooltip.style.top  = (e.clientY - 36) + 'px';
      });
      chart.addEventListener('mouseleave', () => { tooltip.style.display = 'none'; });
    })();

    function showHoldingDetail(holding) {
      const isStable = STABLECOINS.has(holding.symbol);
      const sym      = esc(holding.symbol);

      let description;
      if (isStable) {
        description = `${sym} is a stablecoin — each unit is pegged to $1 USD.`;
      } else if (holding.price_per_token) {
        description = `${sym} is a Solana token currently worth ~$${fmtAmt(holding.price_per_token)} per token.`;
      } else {
        description = `${sym} is an unidentified token — likely a meme coin or airdrop with no trackable price.`;
      }

      const usdDisplay   = holding.usd_value      != null ? `$${fmtAmt(holding.usd_value)}`       : 'price unknown';
      const priceDisplay = holding.price_per_token != null ? `$${fmtAmt(holding.price_per_token)}` : '—';

      const badge = holding.usd_value != null
        ? `<span class="badge priced">Currently Held</span>`
        : `<span class="badge">No Price Data</span>`;

      let rows = '';
      rows += `<span class="desc">${description}</span>`;
      rows += `<span class="rule"></span>`;
      rows += `<span class="label">Amount held</span><span class="value">${fmtAmt(holding.amount)} ${sym}</span>`;
      rows += `<span class="label">USD value</span><span class="value" style="font-weight:600">${usdDisplay}</span>`;
      rows += `<span class="label">Price / token</span><span class="value">${priceDisplay}</span>`;
      rows += `<span class="label">Mint address</span><span class="value" style="line-height:1.8">
        <span style="word-break:break-all">${esc(holding.mint)}</span><br>
        <button class="copy-btn" data-addr="${esc(holding.mint)}">Copy address</button>
      </span>`;

      document.getElementById('token-detail-name').innerHTML = `${sym}${badge}`;
      document.getElementById('token-detail-grid').innerHTML = rows;
      document.getElementById('token-detail').style.display  = 'block';
    }
  </script>
</body>
